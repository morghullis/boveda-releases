name: Publicar versión

# El CI privado de Bóveda empuja aquí (rama `incoming`) los instaladores firmados
# y el manifiesto latest.json. Este workflow los convierte en una GitHub Release.
on:
  push:
    branches: [incoming]

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: incoming
          persist-credentials: false

      - name: Crear la versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version latest.json)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versión inválida en latest.json" >&2
            exit 1
          fi
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "La versión $TAG ya está publicada" >&2
            exit 1
          fi
          # Primero como borrador (sube todos los archivos) y luego se publica: así el
          # actualizador nunca ve una versión a medio subir.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main --draft \
            --title "Bóveda $VERSION" --notes-file NOTES.md \
            Boveda-Windows-x64-Setup.exe Boveda-Windows-x64-Setup.exe.sig \
            Boveda-macOS.dmg Boveda-macOS.app.tar.gz Boveda-macOS.app.tar.gz.sig \
            latest.json
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
